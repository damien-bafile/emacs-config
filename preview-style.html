<!-- Catppuccin Mocha styling for pandoc HTML previews (matches config.org) -->
<style>
  body {
    max-width: 980px;
    margin: 0 auto;
    padding: 2em;
    background: #000;
    color: #cdd6f4;
    font: 16px/1.6 "Segoe UI", sans-serif;
  }
  h1, h2, h3, h4 { border-bottom: 1px solid #313244; padding-bottom: .3em; }
  a { color: #89b4fa; }
  code, pre { font-family: "FiraCode Nerd Font", Consolas, monospace; font-size: .9em; }
  code { background: #1e1e2e; padding: .2em .4em; border-radius: 6px; }
  pre { background: #050507; padding: 1em; border-radius: 8px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  table { border-collapse: collapse; }
  th, td { border: 1px solid #313244; padding: .4em .8em; }
  blockquote {
    border-left: 4px solid #89b4fa;
    color: #a6adc8;
    margin-left: 0;
    padding-left: 1em;
  }
  img { max-width: 100%; }

  /* Skylighting token classes -> Catppuccin Mocha palette
     (strings yellow, as in the Emacs theme) */
  .sourceCode .kw { color: #cba6f7; }              /* keyword      */
  .sourceCode .cf { color: #cba6f7; }              /* control flow */
  .sourceCode .im { color: #cba6f7; }              /* import       */
  .sourceCode .dt { color: #89b4fa; }              /* data type    */
  .sourceCode .at { color: #89b4fa; }              /* attribute    */
  .sourceCode .fu { color: #89dceb; }              /* function     */
  .sourceCode .st { color: #cba6f7; }              /* string       */
  .sourceCode .sc { color: #a6e3a1; }              /* special char */
  .sourceCode .ss { color: #cba6f7; }              /* special str  */
  .sourceCode .dv, .sourceCode .bn, .sourceCode .fl { color: #fab387; } /* numbers */
  .sourceCode .ot, .sourceCode .op { color: #94e2d5; } /* operators/types */
  .sourceCode .co, .sourceCode .do { color: #6c7086; font-style: italic; } /* comments */
  .sourceCode .al, .sourceCode .er, .sourceCode .pp { color: #f38ba8; }   /* errors, preproc */
  .sourceCode .va { color: #cdd6f4; }              /* variable     */
  .sourceCode .an, .sourceCode .cv { color: #89b4fa; }
</style>
